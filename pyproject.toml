[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-media-hub"
version = "1.0.0"
description = "Composite MCP server - VirtualDJ + Plex + more (cross-server workflows)"
authors = [
    {name = "Sandra Schipal", email = "sandraschipal@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["mcp", "dj", "plex", "virtualdj", "fastmcp", "composite", "media"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video"
]

dependencies = [
    "aubio>=0.4.9",
    "fastmcp>=3.4.4,<4",
    # Mount these as local editable installs or PyPI packages
    # For now, we'll assume they're installed in the same environment
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0"
]
# Install the component servers
servers = [
    "virtualdj-mcp @ file:///D:/Dev/repos/virtualdj-mcp",
    "plexmcp @ file:///D:/Dev/repos/plex-mcp"
]

[project.scripts]
dj-media-hub = "dj_media_hub.server:main"

[project.urls]
Homepage = "https://github.com/sandraschi/dj-media-hub"
Repository = "https://github.com/sandraschi/dj-media-hub.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
[tool.ruff.lint]
ignore = ["S104", "S310", "S311", "S314", "S608", "S108", "S603", "S301", "S103", "S112", "S105", "S607", "S701", "S102", "S307", "S324", "ASYNC230", "B008", "B904", "B025", "B019", "B023", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "S110", "RUF012", "DTZ005", "DTZ006", "DTZ001", "E741", "SIM115", "SIM102", "RUF100", "F401", "D103", "D101", "F821", "TRY002"]

line-length = 100
target-version = "py311"


